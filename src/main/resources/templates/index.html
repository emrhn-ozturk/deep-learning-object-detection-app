<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap | Deep Learning App</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #101827, #203451);
            color: #ffffff;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: #ffffff;
            color: #172033;
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        }

        .logo {
            width: 56px;
            height: 56px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            background: #e8efff;
            color: #315ee7;
            border-radius: 16px;
            font-size: 28px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #687386;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d6dce5;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #315ee7;
            box-shadow: 0 0 0 3px rgba(49, 94, 231, 0.12);
        }

        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #315ee7;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-button:hover {
            background: #244ac2;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            color: #8a94a6;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">AI</div>

    <h1>Hoş Geldin</h1>

    <p class="subtitle">
        Deep Learning App hesabına giriş yap.
    </p>

    <form action="/login" method="post">

        <div class="form-group">
            <label for="username">Kullanıcı Adı</label>
            <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Kullanıcı adını gir"
                    autocomplete="username"
                    required
            >
        </div>

        <div class="form-group">
            <label for="password">Şifre</label>
            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Şifreni gir"
                    autocomplete="current-password"
                    required
            >
        </div>

        <p th:if="${error}" th:text="${error}"
           style="color: #dc2626; margin-bottom: 15px;"></p>

        <p th:if="${message}" th:text="${message}"
           style="color: #15803d; margin-bottom: 15px;"></p>

        <button type="submit" class="login-button">
            Giriş Yap
        </button>

    </form>

    <div class="footer">
        Deep Learning App · Güvenli Giriş
    </div>

</div>

</body>
</html>
